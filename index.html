    <style>
      :root {
        --bg: #f5f0e7;
        --bg-deep: #e8dfd0;
        --text: #503020;
        --muted: #766658;
        --accent: #9a6b3f;
        --line: rgba(80, 48, 32, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.72), transparent 48%),
          linear-gradient(145deg, var(--bg), var(--bg-deep));
        font-family: "DM Sans", system-ui, sans-serif;
      }

      main {
        min-height: calc(100vh - 74px);
        display: grid;
        place-items: start center;
        padding: clamp(6rem, 15vh, 10rem) 1.25rem 4rem;
        position: relative;
        overflow: hidden;
      }

      .hero {
        width: min(100%, 760px);
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .logo-frame {
        width: min(100%, 624px);
        min-height: 300px;
        display: grid;
        place-items: center;
        margin: 0 auto 1.75rem;
        position: relative;
        z-index: 1;
      }

      .logo-frame img {
        display: block;
        width: min(100%, 576px);
        max-height: 300px;
        object-fit: contain;
        mix-blend-mode: multiply;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--accent);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .message {
        max-width: 500px;
        margin: 1.15rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.6vw, 1.15rem);
        line-height: 1.7;
      }

      .owner-link {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 1.5rem;
        padding: 0.62rem 0.95rem;
        border: 1px solid rgba(154, 107, 63, 0.34);
        border-radius: 999px;
        color: var(--accent);
        background: rgba(255, 255, 255, 0.28);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
      }

      .owner-link:hover {
        border-color: rgba(154, 107, 63, 0.65);
        background: rgba(255, 255, 255, 0.62);
        transform: translateY(-1px);
      }

      .rule {
        width: 76px;
        height: 1px;
        margin: 2rem auto 0;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
      }

      .site-footer-credit {
        min-height: 74px;
        display: grid;
        place-items: center;
        padding: 1rem;
        border-top: 1px solid var(--line);
        color: rgba(80, 48, 32, 0.62);
        font-size: 0.88rem;
      }

      .site-footer-credit p { margin: 0; }

      .site-footer-credit a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      .site-footer-credit a:hover { text-decoration: underline; }
    </style>

            alt="Boulder Creek Plumbing LLC logo"

        <p class="eyebrow">Coming soon</p>
        <p class="message">We’re putting the finishing touches on the new site.</p>
        <a

          href="https://www.n3xra.com/account"
          target="_blank"
          rel="noopener"
          aria-label="Are you the owner? Click here to see live updates and manage files."
        >
          Owner access <span aria-hidden="true">↗</span>
        </a>
        <div class="rule" aria-hidden="true"></div>
      </section>
    </main>

    <footer class="site-footer-credit">
      <p>Designed &amp; Built by <a href="https://n3xra.com" target="_blank" rel="noopener">N3XRA</a></p>
